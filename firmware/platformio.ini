; SolWatch-1U firmware — one project, three ESP32 programs.
;   pio run -e satellite -t upload
;   pio run -e groundstation -t upload
;   pio run -e dewnode -t upload
; Copy include/secrets.example.h to include/secrets.h first.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  sandeepmistry/LoRa @ ^0.8.0
  bblanchon/ArduinoJson @ ^7.0.0

[env:satellite]
build_src_filter = +<satellite/>
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ADS1X15 @ ^2.5.0
  adafruit/Adafruit INA219 @ ^1.2.3
  mprograms/QMC5883LCompass @ ^1.2.3
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0

[env:groundstation]
build_src_filter = +<groundstation/>

[env:dewnode]
build_src_filter = +<dewnode/>
lib_deps =
  ${env.lib_deps}
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0
